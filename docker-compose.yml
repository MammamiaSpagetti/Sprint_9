name: sprint9

services:
  selenoid:
    image: aerokube/selenoid:1.11.3
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid:ro
    ports:
      - "127.0.0.1:4444:4444"
    command:
      - -conf
      - /etc/selenoid/browsers.json
      - -container-network
      - sprint9_default
      - -limit
      - "2"
      - -timeout
      - 2m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4444/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build: .
    environment:
      SELENOID_URI: http://selenoid:4444/wd/hub
    volumes:
      - ./allure-results:/app/allure-results
    depends_on:
      selenoid:
        condition: service_healthy
